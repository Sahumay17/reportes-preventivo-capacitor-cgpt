// Uses node_modules/@capacitor/android/capacitor when present, falling back to ./capacitor-android
include ':capacitor-android'
def npmCapDir = new File(rootDir, 'node_modules/@capacitor/android/capacitor')
def localCapDir = new File(rootDir, 'capacitor-android')
project(':capacitor-android').projectDir = npmCapDir.exists() ? npmCapDir : localCapDir
